<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GeoDatos sobre Bolivia</title>
    <meta
      name="description"
      content="Índice público de datos geográficos sobre Bolivia descubiertos en servicios GeoServer."
    >
    <link rel="icon" href="https://mauforonda.github.io/images/icon.svg">
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <nav class="nav" role="tablist" aria-label="Tipo de índice">
          <div class="buttons">
            <button class="button is-active" id="mode-descubrir" data-mode="descubrir" role="tab" aria-selected="true">
              Descubiertos
            </button>
            <button class="button" id="mode-archivo" data-mode="archivo" role="tab" aria-selected="false">
              Archivados
            </button>
          </div>
          <div class="title" id="site-title">GeoDatos sobre Bolivia</div>
        </nav>
        <div class="legend" id="legend"></div>
      </header>

      <main>
        <section class="search" id="search">
          <input id="search-input" type="text" inputmode="search" aria-label="Buscar por nombre, descripción o fuente" placeholder="Buscar por nombre, descripción o fuente ...">
        </section>

        <div class="results-shell">
          <div class="result-count" id="results-summary">…</div>
          <section id="results" class="results" aria-live="polite"></section>
        </div>

        <section id="empty-state" class="empty is-hidden">
          <p>¯\_(ツ)_/¯</p>
        </section>

        <section id="placeholder-state" class="empty is-hidden">
          <h2>Archivados pronto</h2>
          <p>
            Esta misma interfaz mostrará luego el índice de datasets archivados, reutilizando
            el mismo shell y un card especializado para preservación.
          </p>
        </section>

        <button id="load-more" class="show-more is-hidden" type="button">Mostrar más</button>
      </main>

      <footer class="footer is-hidden">
        <div class="source">Actualizado desde <a href="https://github.com/mauforonda/geodatos/">Github</a>.</div>
        <div class="attribution">Creado por <a href="https://mauforonda.github.io">Mauricio Foronda</a>.</div>
      </footer>
    </div>

    <template id="discover-card-template">
      <article class="result" tabindex="0">
        <div class="preview">
          <img class="image is-hidden" alt="" loading="lazy">
          <div class="fallback"></div>
          <div class="result-title">
            <h2 class="title"></h2>
          </div>
          <div class="details">
            <div class="details-body">
              <header>
                <h2 class="title"></h2>
                <div class="geoserver"></div>
                <p class="description is-hidden"></p>
              </header>
              <div class="buttons"></div>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
