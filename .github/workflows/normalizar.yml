name: Normalizar
on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:

concurrency:
  group: repo-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  normalize:
    name: normalize archived geoparquets, commit and push
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Configurar git
        run: |
          git config --global user.email "geodatos-bot@example.com"
          git config --global user.name "geodatos-bot"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout master
      - name: Normalizar geoparquets
        run: |
          status=0
          python -m archivar.normalizar --max-minutes 100 --commit || status=$?
          if [ "$status" -eq 2 ]; then
            echo "No quedan geoparquets por normalizar."
            exit 0
          fi
          exit "$status"
