name: Enriquecer GeoBolivia

on:
  workflow_dispatch:

concurrency:
  group: repo-maintenance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  enrich:
    name: enrich local and Archive.org metadata
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enrich and checkpoint local metadata
        run: |
          set -euo pipefail

          git config user.email "geodatos-bot@example.com"
          git config user.name "geodatos-bot"

          while true; do
            git fetch origin master
            git checkout -B master origin/master

            set +e
            python -m archivar.enriquecer_geobolivia --max-items 25
            status=$?
            set -e

            git add descubrir/capas.csv evaluar/datasets.csv archivar/paquetes.csv archivar/publicados
            if ! git diff --cached --quiet; then
              git commit -m "[metadata] enriquecer GeoBolivia"
              git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
            fi

            if [ "$status" -eq 2 ]; then
              echo "No quedan items de GeoBolivia por enriquecer."
              break
            fi
            if [ "$status" -ne 0 ]; then
              echo "La ejecución encontró errores; el progreso ya fue guardado."
              exit "$status"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
